name: Update live research metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh Google Scholar metrics
        run: python .github/scripts/update_live_research_metrics.py
      - name: Commit refreshed metrics when changed
        run: |
          if git diff --quiet -- assets/data/live-research-metrics.json; then
            echo "No metric change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/live-research-metrics.json
          git commit -m "Refresh live research metrics"
          git push
