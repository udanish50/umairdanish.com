name: Refresh Google Scholar metrics

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: scholar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Scholar data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out website
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Scholar updater
        run: python -m py_compile scripts/update_scholar.py

      - name: Refresh Google Scholar snapshot
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_scholar.py

      - name: Commit updated metrics
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- assets/data/scholar-metrics.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Google Scholar metrics are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/scholar-metrics.json
          git commit -m "Refresh Google Scholar metrics"

          git pull --rebase origin main
          git push origin HEAD:main

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/pages/builds"

          echo "GitHub Pages rebuild requested successfully."

      - name: Display refresh summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("assets/data/scholar-metrics.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          metrics = data.get("metrics", {})
          citations = metrics.get("citations", {}).get("all", "unknown")
          h_index = metrics.get("h_index", {}).get("all", "unknown")
          i10_index = metrics.get("i10_index", {}).get("all", "unknown")
          works = metrics.get("article_count", "unknown")
          graph_points = len(data.get("citation_graph") or [])

          print(f"Citations: {citations}")
          print(f"h-index: {h_index}")
          print(f"i10-index: {i10_index}")
          print(f"Scholar works: {works}")
          print(f"Citation-history points: {graph_points}")
          print(f"Updated at: {data.get('updated_at', 'unknown')}")

          if graph_points == 0:
              raise SystemExit(
                  "The Scholar refresh completed without citation-history data."
              )
          PY
